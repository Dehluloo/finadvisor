name: Cloudflare Worker
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Перевірка ключів
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::warning::Додайте секрети CLOUDFLARE_API_TOKEN і CLOUDFLARE_ACCOUNT_ID"; exit 0; fi
          echo "READY=1" >> $GITHUB_ENV
      - name: База D1
        if: env.READY == '1'
        working-directory: worker
        run: |
          ID=$(npx -y wrangler@3 d1 list --json | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((x['uuid'] for x in d if x['name']=='finrad'),''))")
          if [ -z "$ID" ]; then npx -y wrangler@3 d1 create finrad; ID=$(npx -y wrangler@3 d1 list --json | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((x['uuid'] for x in d if x['name']=='finrad'),''))"); fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
      - name: Розгортання
        if: env.READY == '1'
        working-directory: worker
        run: |
          npx -y wrangler@3 deploy 2>&1 | tee deploy.log
          KEY=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-32)
          printf '%s' "$KEY" | npx -y wrangler@3 secret put ADMIN_KEY
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "URL=$URL" >> $GITHUB_ENV
      - name: Повідомити програму адресу
        if: env.READY == '1' && env.URL != ''
        run: |
          printf '{"worker":"%s"}\n' "$URL" > data/config.json
          git config user.name "finadvisor-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/config.json
          if ! git diff --cached --quiet; then git commit -m "Адреса Worker"; git pull --rebase origin main; git push; fi
