name: Cloudflare Worker
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Перевірка ключів
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::Додайте секрет CLOUDFLARE_API_TOKEN"; exit 0; fi
          T=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | python3 -c "import re,sys; s=sys.stdin.read().strip(); s=re.sub(r'^(Bearer\s+)', '', s).strip().strip(chr(34)+chr(39)); m=re.findall(r'[A-Za-z0-9_.-]{30,}', s); print(max(m, key=len) if m else s)")
          if printf '%s' "$T" | grep -qE '^[0-9a-f]{32}$'; then echo "::error::У секреті CLOUDFLARE_API_TOKEN лежить Account ID (32 символи), а не токен. Покладіть Account ID у CLOUDFLARE_ACCOUNT_ID, а в CLOUDFLARE_API_TOKEN — сам токен"; exit 1; fi
          echo "::add-mask::$T"; export CLOUDFLARE_API_TOKEN="$T"; echo "CLOUDFLARE_API_TOKEN=$T" >> $GITHUB_ENV
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0]['id'] if r else '')")
            if [ -z "$ACC" ]; then ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/memberships" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0]['account']['id'] if r else '')"); fi
            if [ -z "$ACC" ]; then curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c "import json,sys; d=json.load(sys.stdin); print('verify:', d.get('success'), (d.get('result') or {}).get('status'), [e.get('message') for e in d.get('errors',[])])"; curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts" | python3 -c "import json,sys; d=json.load(sys.stdin); print('accounts:', d.get('success'), len(d.get('result') or []), [e.get('message') for e in d.get('errors',[])])"; fi
            if [ -z "$ACC" ]; then echo "::error::Не вдалося визначити Account ID — додайте секрет CLOUDFLARE_ACCOUNT_ID"; exit 1; fi
            echo "::add-mask::$ACC"; echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> $GITHUB_ENV
          fi
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c "import json,sys; d=json.load(sys.stdin); print('token verify:', d.get('success'), (d.get('result') or {}).get('status'), [e.get('message') for e in d.get('errors',[])])" || true
          echo "READY=1" >> $GITHUB_ENV
      - name: База D1
        if: env.READY == '1'
        working-directory: worker
        run: |
          q() { npx -y wrangler@3 d1 list --json 2>/dev/null | python3 -c "import json,sys
          try: d=json.load(sys.stdin); print(next((x['uuid'] for x in d if x['name']=='finrad'),''))
          except Exception: print('')"; }
          ID=$(q); if [ -z "$ID" ]; then npx -y wrangler@3 d1 create finrad >/dev/null 2>&1 || true; ID=$(q); fi
          if [ -n "$ID" ]; then sed -i "s/__D1_ID__/$ID/" wrangler.toml; echo "D1 ok"
          else echo "::error::Токен без доступу до D1. FinRAD 4 зберігає новини й підписки в D1 — додайте токену право Account → D1 → Edit"; exit 1; fi
      - name: Розгортання
        if: env.READY == '1'
        working-directory: worker
        run: |
          npx -y wrangler@3 deploy 2>&1 | tee deploy.log
          KEY=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-32)
          printf '%s' "$KEY" | npx -y wrangler@3 secret put ADMIN_KEY
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]' | npx -y wrangler@3 secret put TELEGRAM_BOT_TOKEN && echo "Telegram-бот підключено"; else echo "::notice::Секрету TELEGRAM_BOT_TOKEN немає — Telegram вимкнено (push працює)"; fi
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "URL=$URL" >> $GITHUB_ENV
      - name: Повідомити програму адресу
        if: env.READY == '1' && env.URL != ''
        run: |
          printf '{"worker":"%s"}\n' "$URL" > data/config.json
          git config user.name "finadvisor-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/config.json
          if ! git diff --cached --quiet; then git commit -m "Адреса Worker"; git pull --rebase --autostash origin main; git push; fi
