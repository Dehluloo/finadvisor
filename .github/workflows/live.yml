name: Живі новини
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - name: Гілка live (дані щохвилини, без перебудови сайту)
        run: |
          git config --global user.name "finadvisor-bot"
          git config --global user.email "actions@users.noreply.github.com"
          if git clone -q --depth 1 --branch live "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" live-dir; then
            echo "live branch ok"
          else
            mkdir live-dir && cd live-dir && git init -q -b live
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
            for f in live.json tg.json brief_en.json; do [ -f ../data/$f ] && cp ../data/$f . || true; done
            printf 'Живі дані FinRAD. Оновлюються автоматично щохвилини.\n' > README.md
            git add -A && git commit -q -m live && git push -q -f origin live
          fi
      - name: Збирати дані щохвилини (~55 хв)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LIVE_DIR: live-dir
        run: |
          end=$(( $(date +%s) + 55*60 ))
          while [ $(date +%s) -lt $end ]; do
            start=$(date +%s)
            git pull -q --ff-only origin main 2>/dev/null || true
            timeout 80 python3 tools/fetch_live.py || echo "збір не вдався, наступна спроба"
            (cd live-dir && git add -A && (git commit -q --amend -m "live $(date -u +%H:%M)" || true) && git push -q -f origin live) || echo "push failed"
            left=$(( 60 - ($(date +%s) - start) )); [ $left -gt 0 ] && sleep $left || true
          done
      - name: Запустити наступну годину
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live.yml --repo ${{ github.repository }} --ref main || gh api -X POST repos/${{ github.repository }}/actions/workflows/live.yml/dispatches -f ref=main || true
