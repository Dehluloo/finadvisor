name: Живі новини
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Гілка live (дані щохвилини, без перебудови сайту)
        run: |
          git config --global user.name "finadvisor-bot"
          git config --global user.email "actions@users.noreply.github.com"
          if git clone -q --depth 1 --branch live "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" live-dir; then
            echo "live branch ok"
          else
            mkdir live-dir && cd live-dir && git init -q -b live
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
            for f in live.json tg.json tr_cache.json brief_en.json; do [ -f ../data/$f ] && cp ../data/$f . || true; done
            printf 'Живі дані FinRAD. Оновлюються автоматично щохвилини.\n' > README.md
            git add -A && git commit -q -m live && git push -q -f origin live
          fi
      - name: Збирати дані щохвилини (~5 хв)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LIVE_DIR: live-dir
        run: |
          for i in 1 2 3 4 5; do
            timeout 80 python3 tools/fetch_live.py || echo "збір не вдався, наступна спроба"
            (cd live-dir && git add -A && (git commit -q --amend -m "live $(date -u +%H:%M)" || true) && git push -q -f origin live) || echo "push failed"
            [ $i -lt 5 ] && sleep 45 || true
          done
